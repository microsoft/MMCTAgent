[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry]
name = "mmct-agent-framework"
version = "0.1.0"
description = "A blazingly fast, async-first agentic framework with swarm collaboration"
readme = "README.md"
license = "MIT"
authors = ["Microsoft <mmct@microsoft.com>"]
packages = [{ include = "mmct_agent", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11"
openai = ">=1.0.0"
pydantic = ">=2.0.0"
pydantic-settings = ">=2.0.0"
tiktoken = ">=0.5.0"
aiofiles = ">=23.0.0"
azure-identity = ">=1.15.0"
loguru = ">=0.7.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.0.0"
ruff = ">=0.1.0"
mypy = ">=1.0.0"

[project]
name = "mmct-agent-framework"
version = "0.1.0"
description = "A blazingly fast, async-first agentic framework with swarm collaboration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Microsoft", email = "mmct@microsoft.com" }
]
keywords = [
    "agents",
    "llm",
    "ai",
    "swarm",
    "azure-openai",
    "async",
    "multi-agent"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tiktoken>=0.5.0",
    "aiofiles>=23.0.0",
    "azure-identity>=1.15.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/microsoft/MMCTAgent"
Repository = "https://github.com/microsoft/MMCTAgent"

[tool.hatch.build.targets.wheel]
packages = ["src/mmct_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.ruff.isort]
known-first-party = ["mmct_agent"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
