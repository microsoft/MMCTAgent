video_uri: samples/videos/demo.mp4
transcript_path: samples/transcripts/demo_transcript.srt
output_dir: outputs/demo
metadata:
  experiment: sample
  notes: "Demo configuration showing interchangeable steps"
pipeline:
  name: sample-pipeline
  mode: sequential
  steps:
    - id: video_chunks
      type: video.chunk.basic
    - id: chunk_sentence_guard
      type: video.chunk.align-transcript
      params:
        chunks_step: video_chunks
    - id: fps_frames
      type: frames.fps
      params:
        fps: 0.5
        max_frames: 12
        max_frames_per_chunk: 3
        chunks_step: chunk_sentence_guard
    - id: clean_transcript
      type: transcript.clean
      params:
        min_chars: 10
    - id: sequential_chapters
      type: chapters.sequential
      params:
        source_step: clean_transcript
        max_duration: 40
        max_segments: 2
    - id: export_bundle
      type: export.knowledge-pack
      params:
        chapters_step: sequential_chapters
        frames_step: fps_frames
        file_name: demo_knowledge_pack.json
