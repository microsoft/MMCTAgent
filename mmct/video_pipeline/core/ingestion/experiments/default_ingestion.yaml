pipeline:
  name: "default_ingestion"
  mode: "sequential"

  steps:
    # Step 1: Pre-validation (early check + audio validation combined)
    - id: "pre_validation"
      type: "ingestion.pre_validation"
      params:
        skip_if_exists: true
        require_audio_when_no_transcript: true

    # Step 2: Compress video
    - id: "compress"
      type: "ingestion.compress"
      params:
        max_size_mb: 500
        target_size_mb: 500
        device: "cuda"

    # Step 3: Transcribe video or use provided transcript
    - id: "transcribe"
      type: "ingestion.transcribe"
      params:
        video_step: "compress" # Explicitly state input source
        apply_time_offset: false

    # Step 4: Video Chunking
    # "transcript" strategy performs inline semantic clustering
    # "scene" strategy uses scene detection
    - id: "video_chunking"
      type: "ingestion.video_chunking"
      params:
        chunking_strategy: "scene"
        transcript_step: "transcribe"
        compress_step: "compress"

    # Step 6: Extract keyframes from full compressed video
    - id: "keyframes"
      type: "ingestion.keyframes"
      params:
        source_step: "compress"
        apply_time_offset: false
        motion_threshold: 1.5
        max_frame_width: 800
        sample_fps: 2
        device: "cuda"

    # Step 7: Generate chapters from transcript and keyframes per chunk
    - id: "chapters"
      type: "ingestion.chapters"
      params:
        transcript_step: "transcribe" # Global transcript available, but step uses chunk transcripts
        keyframes_step: "keyframes"
        video_chunking_step: "video_chunking"
        chapter_gen_technique: "simple"
        max_chapter_duration: 300 
        max_concurrent_requests: 3

    # Step 8: Generate embeddings (Should be able to handle list of chapters)
    - id: "embeddings"
      type: "ingestion.embeddings"
      params:
        chapters_step: "chapters"
        keyframes_step: "keyframes"

    # Step 9: Upload files and index data
    - id: "upload"
      type: "ingestion.upload"
      params:
        chapters_step: "chapters"
        keyframes_step: "keyframes"
        embeddings_step: "embeddings"

    # Step 10: Cleanup temporary files
    - id: "cleanup"
      type: "ingestion.cleanup"
      params:
        keep_keyframes: false
