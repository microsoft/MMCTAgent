pipeline:
  name: "default_ingestion"
  mode: "sequential"

  steps:
    # Step 1: Pre-validation (early check + audio validation combined)
    - id: "pre_validation"
      type: "ingestion.pre_validation"
      params:
        skip_if_exists: true
        require_audio_when_no_transcript: true

    # Step 2: Compress video
    - id: "compress"
      type: "ingestion.compress"
      params:
        max_size_mb: 500
        target_size_mb: 500
        device: "cuda"

    # Step 3: Transcribe video or use provided transcript
    - id: "transcribe"
      type: "ingestion.transcribe"
      params:
        video_step: "compress"

    # Step 4: Video Chunking
    # "transcript" strategy performs inline semantic clustering
    # "scene" strategy uses scene detection
    - id: "video_chunking"
      type: "ingestion.video_chunking"
      params:
        chunking_strategy: "transcript"
        transcript_step: "transcribe"
        compress_step: "compress"
        scene_settings:
          min_scene_length: 50.0
          threshold: 60.0
          max_scene_length: 600.0

    # Step 5: Extract keyframes from full compressed video
    - id: "keyframes"
      type: "ingestion.keyframes"
      params:
        source_step: "compress"
        motion_threshold: 1.5
        max_frame_width: 800
        sample_fps: 2
        device: "cuda"

    # Step 6: Generate chapters from transcript and keyframes per chunk
    - id: "chapters"
      type: "ingestion.chapters"
      params:
        transcript_step: "transcribe"
        keyframes_step: "keyframes"
        video_chunking_step: "video_chunking"
        max_concurrent_requests: 3
        collect_object_collection: true
        max_frames_per_chapter: 14

    # Step 7: Enrich chapters and generate summaries
    - id: "chapter_enrichment"
      type: "ingestion.chapter_enrichment"
      params:
        chapters_step: "chapters"
        collect_object_collection:
          enabled: true
          min_screen_time_seconds: 5.0
          max_active_context: 20
          min_chunk_occurrences: 1
        segmented_enrichment:
          enabled: false
          segment_count: 5
          boundary_window: 2

    # Step 8: Generate embeddings
    - id: "embeddings"
      type: "ingestion.embeddings"
      params:
        chapters_step: "chapter_enrichment"
        keyframes_step: "keyframes"

    # Step 9: Upload files and index data
    - id: "upload"
      type: "ingestion.upload"
      params:
        chapters_step: "chapter_enrichment"
        keyframes_step: "keyframes"
        embeddings_step: "embeddings"

    # Step 10: Cleanup temporary files
    - id: "cleanup"
      type: "ingestion.cleanup"
      params:
        keep_keyframes: false
